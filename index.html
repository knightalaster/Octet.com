<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Octet.com</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #101010;
            color: #f2f2f2;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 450px;
            padding: 30px 20px;
        }

        h1 {
            font-size: 48px;
            font-weight: 400;
            letter-spacing: 5px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #888;
            font-size: 13px;
            letter-spacing: 2px;
            margin-bottom: 45px;
        }

        .music-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .music-button {
            display: block;
            width: 100%;
            padding: 18px;
            background: #1c1c1c;
            border: 1px solid #383838;
            border-radius: 8px;
            color: #eee;
            text-decoration: none;
            font-size: 16px;
            transition: 0.2s;
        }

        .music-button:hover {
            background: #292929;
            border-color: #888;
            transform: translateY(-2px);
        }

        .footer {
            margin-top: 50px;
            color: #555;
            font-size: 11px;
            letter-spacing: 2px;
        }
    </style>
</head>

<body>

    <main class="container">
        <h1>Octet.com</h1>

        <p class="subtitle">CHOOSE A SONG</p>

        <div class="music-list">
            <a href="Always.html" class="music-button">
                Always
            </a>
            
            <a href="nootherheart.html" class="music-button">
                No Other Heart
            </a>
            
            <a href="thinkin.html" class="music-button">
                Thinkin bout you
            </a>
            
            <a href="Du30.html" class="music-button">
                Tatay Digong
            </a>
        </div>

        <p class="footer">TUGTOG NI ELMER X JOBEL X CLARK 3SAM</p>
    </main>

</body>
</html>
